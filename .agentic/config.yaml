# What this repository says about itself to the agent working on it: its check layers, where their
# tests live, and its share of the guard. Read from the launch directory, used once approved — any
# change asks for approval again. The installation's own settings are in config/packages/agentic.php.

checks:
    component-static:
        command:
            - php8.2 vendor/bin/phpunit --testsuite static --log-junit {report}
            - php8.2 vendor/bin/phpstan analyse --no-progress --error-format=junit --memory-limit=1G
        cwd: packages/agentic
        description: 'agentic: architecture rules, test pyramid, PHPStan level 8'
        tests: 'packages/agentic/tests/ArchitectureTest.php (dependency rules between layers of the code) and tests/TestPyramidTest.php; add a rule rather than a new file'
    component-unit:
        command: php8.2 vendor/bin/phpunit --testsuite unit --log-junit {report}
        cwd: packages/agentic
        filter_option: --filter
        description: 'agentic: domain and application, in memory'
        tests: 'packages/agentic/tests/Domain and tests/Application, mirroring src/ (src/Domain/Guard/ToolRule.php → tests/Domain/Guard/ToolRuleTest.php); PHP 8.2, PHPUnit 11'
        review: [component-functional, bundle-functional, component-mutation, component-static]
    component-functional:
        command: php8.2 vendor/bin/phpunit --testsuite functional --log-junit {report}
        cwd: packages/agentic
        filter_option: --filter
        description: 'agentic: the durable workflow on Durable''s test environment'
        tests: 'packages/agentic/tests/Infrastructure/<Behaviour>WorkflowTest.php, on Gplanchat\Durable\Testing\WorkflowTestEnvironment with the model scripted'
        review: [bundle-functional, component-mutation, component-static]
    bundle-static:
        command:
            - php8.4 vendor/bin/phpunit --testsuite static --log-junit {report}
            - php8.4 vendor/bin/phpstan analyse --no-progress --error-format=junit --memory-limit=1G
        cwd: packages/agentic-bundle
        description: 'bundle: test pyramid, PHPStan level 8'
        tests: 'packages/agentic-bundle/tests/TestPyramidTest.php only'
    bundle-unit:
        command: php8.4 vendor/bin/phpunit --testsuite unit --log-junit {report}
        cwd: packages/agentic-bundle
        filter_option: --filter
        description: 'bundle: TUI widgets, JUnit reader, configuration, factories'
        tests: 'packages/agentic-bundle/tests/{Ai,Check,Config,Controller,Tool,Tui}, mirroring src/; PHP 8.4, PHPUnit 12'
        review: [bundle-functional, bundle-mutation, bundle-static]
    bundle-functional:
        command: php8.4 vendor/bin/phpunit --testsuite functional --log-junit {report}
        cwd: packages/agentic-bundle
        filter_option: --filter
        description: 'bundle: the kernel with in-memory journal and transports'
        tests: 'packages/agentic-bundle/tests/Integration (historical name), KernelTestCase on TestKernel with in-memory journal and transports'
        review: [bundle-integration, bundle-mutation, bundle-static]
    bundle-integration:
        command: php8.4 vendor/bin/phpunit --testsuite integration --log-junit {report}
        cwd: packages/agentic-bundle
        filter_option: --filter
        description: 'bundle: bubblewrap, git worktrees, project files, MCP servers, HTTP'
        tests: 'packages/agentic-bundle/tests/{Sandbox,Project,Mcp,Chat} and tests/Integration/McpIntegrationTest.php; skip when bwrap is missing'
        review: [bundle-mutation, bundle-static]
    # Infection needs PHP >= 8.3, so it runs the tests it mutates under php8.4 — including the
    # component's, whose own layers run under php8.2. A green mutation layer therefore says nothing
    # about the 8.2 floor; component-unit and component-functional do.
    component-mutation:
        command: sh ../../tools/infection/mutate-changed
        cwd: packages/agentic
        timeout_seconds: 600
        description: 'agentic: mutation testing (Infection) of the lines changed since HEAD, new files included. Runs under PHP 8.4, not the 8.2 floor the other component layers check'
        tests: 'none of its own: a surviving mutant asks for a sharper assertion in the unit or functional tests that cover the line'
    bundle-mutation:
        command: sh ../../tools/infection/mutate-changed
        cwd: packages/agentic-bundle
        timeout_seconds: 900
        description: 'bundle: mutation testing (Infection) of the lines changed since HEAD, new files included'
        tests: 'none of its own: a surviving mutant asks for a sharper assertion in the tests that cover the line'

sandbox:
    # Borrowed read-only by a worktree, next to the installation's vendor/: the packages carry their
    # own, and tools/infection carries Infection, kept out of the packages for its PHP >= 8.3.
    shared: ['packages/*/vendor', 'tools/*/vendor']
    # The machine's default PHP is 8.2; the bundle wants 8.4, so its suite runs through php8.4.
    auto_allow:
        - php8.2 vendor/bin/phpunit
        - php8.2 vendor/bin/phpunit *
        - php8.4 vendor/bin/phpunit
        - php8.4 vendor/bin/phpunit *
